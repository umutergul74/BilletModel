[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "steel-billet-vision"
version = "0.1.0"
description = "Traceable QA tooling for visible steel-billet front-face annotations"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.10,<6",
  "Pillow>=11,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

